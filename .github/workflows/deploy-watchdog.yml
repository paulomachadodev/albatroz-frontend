name: Deploy Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    name: Destrava deploy parado
    runs-on: [self-hosted, infra]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const limite = Date.now() - 20 * 60 * 1000;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status: "queued", per_page: 50 });
            const parados = data.workflow_runs.filter(r =>
              r.event !== "schedule" &&
              r.name !== "Deploy Watchdog" &&
              new Date(r.created_at).getTime() < limite);
            const workflows = [...new Set(parados.map(r => r.workflow_id))];
            for (const workflowId of workflows) {
              const doWorkflow = parados.filter(r => r.workflow_id === workflowId);
              for (const run of doWorkflow) {
                try { await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id }); } catch (e) { core.info(`cancel ${run.id}: ${e.message}`); }
              }
              const { data: recentes } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflowId, per_page: 1 });
              const ultimo = recentes.workflow_runs[0];
              if (ultimo && doWorkflow.some(r => r.id === ultimo.id)) {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflowId, ref: ultimo.head_branch });
                core.warning(`re-disparado workflow ${workflowId} (run ${ultimo.id} parado desde ${ultimo.created_at})`);
              }
            }
