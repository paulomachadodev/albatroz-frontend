<div class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark px-4 sm:px-6 lg:px-8 xl:px-10 py-6 lg:py-8">
  <div class="w-full space-y-8">

    <nav class="flex items-center gap-2 text-sm text-slate-500">
      <a class="hover:text-primary" routerLink="/dashboard">Início</a>
      <span class="material-symbols-outlined text-xs">chevron_right</span>
      <span class="text-slate-900 dark:text-slate-100 font-medium">Cadastros</span>
      <span class="material-symbols-outlined text-xs">chevron_right</span>
      <a class="hover:text-primary" routerLink="/produtos">Produtos</a>
      <span class="material-symbols-outlined text-xs">chevron_right</span>
      <span class="text-slate-900 dark:text-slate-100 font-medium">Marcas</span>
    </nav>

    <app-page-header titulo="Cadastro de Marcas" subtitulo="Marcas disponíveis para vincular a produtos.">
      <button acoes (click)="abrirCriar()"
              class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-primary text-white font-bold text-sm hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
        <span class="material-symbols-outlined text-sm">add</span>
        Nova Marca
      </button>
    </app-page-header>

    <app-listagem-paginada
      [itens]="itens()"
      [carregando]="carregando()"
      [totalRegistros]="totalRegistros()"
      [paginaAtual]="paginaAtual()"
      [totalPaginas]="totalPaginas()"
      [tamanhoPagina]="tamanhoPagina()"
      tituloVazio="Nenhuma marca encontrada"
      (paginaMudou)="aoMudarPagina($event)"
      (tamanhoPaginaMudou)="aoMudarTamanhoPagina($event)">

      <div filtros class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
          <div class="lg:col-span-3">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Nome</label>
            <input type="text" [(ngModel)]="filtroTexto" placeholder="Nome da marca" (keyup.enter)="aplicarFiltros()"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button (click)="aplicarFiltros()"
                  class="px-4 py-2 rounded-lg bg-primary text-white font-bold text-sm hover:bg-primary/90 transition-all">
            Filtrar
          </button>
          <button (click)="limparFiltros()"
                  class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
            Limpar
          </button>
        </div>
      </div>

      <ng-template #cabecalho>
        <tr>
          <th class="px-6 py-4">Nome</th>
          <th class="px-6 py-4">Descrição</th>
          <th class="px-6 py-4 text-center">Origem</th>
          <th class="px-6 py-4 text-center">Situação</th>
        </tr>
      </ng-template>

      <ng-template #linha let-item>
        <tr (click)="abrirEditar(item)" class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors cursor-pointer">
          <td class="px-6 py-4 text-sm font-bold text-slate-900 dark:text-slate-100">{{ item.nome }}</td>
          <td class="px-6 py-4 text-sm text-slate-600 dark:text-slate-400">{{ item.descricao || '-' }}</td>
          <td class="px-6 py-4 text-center">
            @if (item.sincronizadaTiny) {
              <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300">Tiny</span>
            } @else {
              <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-400">ERP</span>
            }
          </td>
          <td class="px-6 py-4 text-center">
            @if (item.ativa) {
              <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400">Ativa</span>
            } @else {
              <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300">Inativa</span>
            }
          </td>
        </tr>
      </ng-template>

    </app-listagem-paginada>

  </div>
</div>

<app-drawer [aberto]="drawerAberto()"
            [titulo]="modoDrawer() === 'criar' ? 'Nova Marca' : 'Editar Marca'"
            (fechar)="cancelar()">

  <div class="space-y-4">
    <div>
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Nome</label>
      <input type="text" [(ngModel)]="nome" placeholder="Nome da marca"
             class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
    </div>

    <div>
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Descrição</label>
      <textarea [(ngModel)]="descricao" rows="3" placeholder="Descrição (opcional)"
                class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none resize-none"></textarea>
    </div>

    <div class="flex items-center justify-between pt-2">
      <span class="text-sm font-bold text-slate-700 dark:text-slate-300">Ativa</span>
      <app-toggle [valor]="ativa" (valorMudou)="aoAlternarAtiva($event)"/>
    </div>

    <div class="pt-2 flex gap-2">
      <button type="button" (click)="cancelar()"
              class="flex-1 px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
        Cancelar
      </button>
      <button type="button" (click)="salvar()" [disabled]="salvando()"
              class="flex-1 px-4 py-2 rounded-lg bg-primary text-white font-bold text-sm hover:bg-primary/90 disabled:opacity-50 transition-all">
        {{ salvando() ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </div>

</app-drawer>
