<button type="button"
        [title]="titulo()"
        [disabled]="desabilitado()"
        (click)="clicar.emit()"
        class="w-8 h-8 flex items-center justify-center rounded-lg shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [class]="variante() === 'perigo'
          ? 'bg-white/90 dark:bg-slate-900/90 text-red-600 hover:bg-red-50 dark:hover:bg-red-950'
          : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'">
  <span class="material-symbols-outlined text-base">{{ icone() }}</span>
</button>
