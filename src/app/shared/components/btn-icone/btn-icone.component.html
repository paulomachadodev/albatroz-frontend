@if (link() !== null) {
  <a [routerLink]="link()" [queryParams]="parametros()" [title]="titulo()" [attr.aria-label]="titulo()" [class]="classes()" (click)="$event.stopPropagation()">
    <span class="material-symbols-outlined text-base">{{ icone() }}</span>
  </a>
} @else {
  <button type="button"
          [title]="titulo()"
          [attr.aria-label]="titulo()"
          [disabled]="desabilitado()"
          (click)="clicar.emit()"
          [class]="classes()">
    <span class="material-symbols-outlined text-base">{{ icone() }}</span>
  </button>
}
