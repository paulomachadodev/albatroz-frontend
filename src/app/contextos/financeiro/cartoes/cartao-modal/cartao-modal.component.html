<app-modal [aberto]="true" [titulo]="titulo" tamanho="md" (fechar)="cancelar()">
  <div class="px-6 pb-6 flex-1 overflow-y-auto">

    <div class="space-y-4">

      <div class="flex gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-lg">
        <button type="button"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-md text-sm font-semibold transition-colors"
                [class]="!ehAdicional() ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500 dark:text-slate-400'"
                (click)="alternarAdicional(false)">
          <span class="material-symbols-outlined text-sm">credit_card</span> Principal
        </button>
        <button type="button"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-md text-sm font-semibold transition-colors"
                [class]="ehAdicional() ? 'bg-white dark:bg-slate-900 text-primary shadow-sm' : 'text-slate-500 dark:text-slate-400'"
                (click)="alternarAdicional(true)">
          <span class="material-symbols-outlined text-sm">add_card</span> Adicional
        </button>
      </div>

      @if (ehAdicional()) {
        <div>
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Cartão principal vinculado *</label>
          <select class="input-modern text-sm" [(ngModel)]="form.idCartaoPrincipal">
            <option [ngValue]="null">Selecionar principal</option>
            @for (p of opcoesPrincipais; track p.id) {
              <option [ngValue]="p.id">{{ p.apelido }} •••• {{ p.ultimos4Digitos }}</option>
            }
          </select>
          @if (!opcoesPrincipais.length) {
            <p class="text-xs text-amber-600 dark:text-amber-400 mt-1">Cadastre um cartão principal antes de criar adicionais.</p>
          }
        </div>
      }

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Apelido *</label>
          <input class="input-modern text-sm" [(ngModel)]="form.apelido" placeholder="Ex: Nubank pessoal" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Bandeira</label>
          <select class="input-modern text-sm" [(ngModel)]="form.bandeira">
            <option value="">Selecionar</option>
            <option value="Visa">Visa</option>
            <option value="Mastercard">Mastercard</option>
            <option value="Elo">Elo</option>
            <option value="Amex">American Express</option>
            <option value="Hipercard">Hipercard</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Últimos 4 dígitos *</label>
        <input class="input-modern text-sm tracking-widest" [(ngModel)]="form.ultimos4Digitos"
               maxlength="4" placeholder="0000" />
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Limite total (R$) *</label>
        <input class="input-modern text-sm" type="number" min="0" step="100"
               [(ngModel)]="form.limiteTotal" placeholder="5000.00" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Dia fechamento *</label>
          <input class="input-modern text-sm" type="number" min="1" max="31"
                 [(ngModel)]="form.diaFechamento" placeholder="3" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">Dia vencimento *</label>
          <input class="input-modern text-sm" type="number" min="1" max="31"
                 [(ngModel)]="form.diaVencimento" placeholder="10" />
        </div>
      </div>

    </div>

    @if (erro()) {
      <div class="mt-4 p-3 bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 rounded-xl text-sm text-rose-700 dark:text-rose-300">
        {{ erro() }}
      </div>
    }

    <div class="flex gap-3 mt-6">
      <button class="btn-ghost flex-1 text-sm" (click)="cancelar()" [disabled]="salvando()">
        Cancelar
      </button>
      <button class="btn-primary flex-1 text-sm" (click)="salvar()" [disabled]="salvando()">
        @if (salvando()) {
          <app-spinner tamanho="sm" [claro]="true"></app-spinner>
        } @else {
          {{ modoEdicao ? 'Salvar alterações' : 'Criar cartão' }}
        }
      </button>
    </div>

  </div>
</app-modal>
