<div class="relative">
  <input type="text"
         [ngModel]="termo() || valorSelecionado()?.nome || ''"
         (ngModelChange)="aoDigitar($event)"
         (focus)="aoFocar()"
         (blur)="aoFecharComAtraso()"
         [placeholder]="placeholder()"
         class="w-full px-3 py-2 pr-8 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>

  @if (valorSelecionado()) {
    <button type="button" (click)="limpar()" title="Limpar"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
      <span class="material-symbols-outlined text-base">close</span>
    </button>
  }

  @if (aberto()) {
    <ul class="mt-1 max-h-56 overflow-y-auto rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-lg absolute z-20 w-full">
      @if (buscando()) {
        <li class="px-3 py-2 text-sm text-slate-400">Buscando...</li>
      } @else if (resultados().length === 0) {
        <li class="px-3 py-2 text-sm text-slate-400">Nenhum resultado.</li>
      } @else {
        @for (opcao of resultados(); track opcao.id) {
          <li (mousedown)="selecionarOpcao(opcao)"
              class="px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">
            {{ opcao.nome }}
          </li>
        }
      }
    </ul>
  }
</div>
