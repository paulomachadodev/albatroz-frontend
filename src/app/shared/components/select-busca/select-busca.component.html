<p-autocomplete
  [ngModel]="valorSelecionado()"
  [suggestions]="resultados()"
  (completeMethod)="executarBusca($event.query)"
  (onSelect)="selecionarOpcao($event.value)"
  (onClear)="limpar()"
  optionLabel="nome"
  dataKey="id"
  [placeholder]="placeholder()"
  [ariaLabel]="placeholder()"
  [showClear]="true"
  [delay]="300"
  [minLength]="1"
  appendTo="body"
  scrollHeight="14rem"
  emptyMessage="Nenhum resultado."
  [pt]="ptBusca" />
