@if (aberto()) {
  <div class="fixed inset-0 z-50">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="fechar.emit()"></div>
    <div class="absolute inset-y-0 right-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl z-10 flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800">
        <h2 class="text-lg font-semibold">{{ titulo() }}</h2>
        <button type="button" (click)="fechar.emit()" class="text-slate-400 hover:text-slate-600">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto" [class.p-4]="!conteudoSemPadding()">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
