<button type="button"
        class="size-4 inline-flex items-center justify-center rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-[10px] font-bold align-middle hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors"
        (mouseenter)="aberto.set(true)" (mouseleave)="aberto.set(false)"
        (click)="aberto.set(!aberto())" [attr.aria-label]="texto()">
  ?
</button>
@if (aberto()) {
  <div [class]="'absolute z-20 left-full top-1/2 -translate-y-1/2 ml-2 px-3 py-2 rounded-lg bg-slate-800 dark:bg-slate-700 text-white text-xs shadow-lg whitespace-pre-line ' + largura()">
    {{ texto() }}
    <div class="absolute right-full top-1/2 -translate-y-1/2 border-4 border-transparent border-r-slate-800 dark:border-r-slate-700"></div>
  </div>
}
