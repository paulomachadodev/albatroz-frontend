<div class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark px-4 sm:px-6 lg:px-8 xl:px-10 py-6 lg:py-8"><div class="w-full space-y-8"><app-breadcrumb [itens]="[{label:'Configurações',rota:'/configuracoes'},{label:'Integrações e canais'},{label:'E-mail e SMTP'}]" /><app-page-header titulo="E-mail e SMTP" subtitulo="Configurações da empresa da sessão." ><a acoes routerLink="/configuracoes" class="text-sm text-primary hover:underline">Voltar às configurações</a></app-page-header>@if(carregando()){<p class="text-sm text-slate-500">Carregando configurações…</p>}@else{<fieldset [disabled]="!podeEditar()" class="min-w-0 space-y-6">
      <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
        <p class="text-sm text-slate-500 dark:text-slate-400">
          Servidor usado para enviar e-mails do sistema (recuperação de senha, notificações).
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="text-xs font-semibold text-slate-500">Servidor SMTP</label>
            <input type="text" [(ngModel)]="smtpHost" placeholder="mail.albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Porta</label>
            <input type="text" [(ngModel)]="smtpPort" placeholder="465"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="smtpSsl" id="smtp-ssl"
                 class="rounded border-slate-300 text-primary focus:ring-primary/20"/>
          <label for="smtp-ssl" class="text-sm text-slate-700 dark:text-slate-300">Usar SSL/TLS</label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Usuário</label>
            <input type="text" [(ngModel)]="smtpUsuario" placeholder="noreply@albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">
              Senha {{ senhaJaConfigurada ? '(já configurada — deixe em branco pra manter)' : '' }}
            </label>
            <input type="password" [(ngModel)]="smtpSenha" [placeholder]="senhaJaConfigurada ? '••••••••' : 'Senha SMTP'"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">E-mail remetente</label>
            <input type="email" [(ngModel)]="smtpRemetente" placeholder="noreply@albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Nome remetente</label>
            <input type="text" [(ngModel)]="smtpNomeRemetente" placeholder="Albatroz Papelaria"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="pt-2">
          <button type="button" (click)="salvarEmail()" [disabled]="salvando()"
                  class="px-5 py-2.5 rounded-lg bg-primary text-white font-bold text-sm hover:bg-primary/90 disabled:opacity-50 transition-all">
            {{ salvando() ? 'Salvando...' : 'Salvar' }}
          </button>
        </div>
      </div>
    </fieldset>}</div></div>
