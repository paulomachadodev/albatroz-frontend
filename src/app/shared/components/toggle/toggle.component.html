<button type="button" role="switch" [attr.aria-checked]="valor()" [disabled]="desabilitado()"
        (click)="alternar()"
        class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50 disabled:cursor-not-allowed"
        [class.bg-primary]="valor()"
        [class.bg-slate-300]="!valor()"
        [class.dark:bg-slate-700]="!valor()">
  <span class="inline-block size-4 transform rounded-full bg-white transition-transform"
        [class.translate-x-6]="valor()"
        [class.translate-x-1]="!valor()"></span>
</button>
@if (label()) {
  <span class="text-sm text-slate-700 dark:text-slate-300">{{ label() }}</span>
}
