<section class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
  <ng-content select="[filtros]"></ng-content>
</section>

<ng-content select="[entreFiltrosEGrid]"></ng-content>

<section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden mt-6">
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 text-xs uppercase tracking-wider font-bold">
        <ng-container [ngTemplateOutlet]="cabecalhoTpl ?? null"></ng-container>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        @if (carregando()) {
          <tr><td colspan="100" class="px-6 py-8 text-center text-slate-400">Carregando...</td></tr>
        } @else {
          @for (item of itens(); track $index) {
            <ng-container [ngTemplateOutlet]="linhaTpl" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
          } @empty {
            <tr><td colspan="100" class="px-6 py-8 text-center text-slate-400">{{ tituloVazio() }}</td></tr>
          }
        }
      </tbody>
    </table>
  </div>
  <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <p class="text-xs text-slate-500">Página {{ paginaAtual() }} de {{ totalPaginas() }} · {{ totalRegistros() }} registros</p>
      <select [value]="tamanhoPagina()" (change)="aoMudarTamanho($event)"
              class="px-2 py-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded text-xs text-slate-600 dark:text-slate-300 outline-none">
        @for (opcao of opcoesTamanhoPagina(); track opcao) {
          <option [value]="opcao">{{ opcao }} / página</option>
        }
      </select>
    </div>
    <div class="flex gap-2">
      <button (click)="paginaAnterior()" [disabled]="paginaAtual() <= 1"
              class="p-1 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 disabled:opacity-40">
        <span class="material-symbols-outlined text-sm">chevron_left</span>
      </button>
      <button (click)="proximaPagina()" [disabled]="paginaAtual() >= totalPaginas()"
              class="p-1 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 disabled:opacity-40">
        <span class="material-symbols-outlined text-sm">chevron_right</span>
      </button>
    </div>
  </div>
</section>
