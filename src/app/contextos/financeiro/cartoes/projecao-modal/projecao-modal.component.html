<app-modal [aberto]="true" titulo="Projeção de parcelas futuras" subtitulo="Compras parceladas encontradas. Selecione quais terão os meses futuros projetados no banco." tamanho="2xl" (fechar)="cancelar.emit()">
  <div class="flex flex-col">

    <div class="space-y-4">
      @for (p of lista(); track $index; let i = $index) {
        <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">

          <div class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-800/50">
            <input type="checkbox" class="size-4 rounded accent-primary"
                   [(ngModel)]="p.selecionada" [id]="'proj-' + i" />
            <label [for]="'proj-' + i" class="flex-1 cursor-pointer">
              <div class="font-semibold text-slate-900 dark:text-slate-100 text-sm">{{ p.descricaoOriginal }}</div>
              <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                Parcela {{ p.parcelaAtual }}/{{ p.totalParcelas }} —
                {{ p.totalParcelas - p.parcelaAtual }} meses restantes a projetar
              </div>
            </label>
          </div>

          @if (p.selecionada && p.parcelas.length > 0) {
            <div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-2">
              @for (m of p.parcelas; track $index; let j = $index) {
                <div class="flex items-center gap-2 p-2 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800">
                  <div class="text-xs text-slate-500 dark:text-slate-400 flex-1">{{ formatarMes(m.mes, m.ano) }}</div>
                  <input type="number" class="input-modern py-1 text-xs w-20 text-right"
                         [(ngModel)]="p.parcelas[j].valor" min="0" step="0.01" />
                </div>
              }
            </div>
          }
        </div>
      }
    </div>


  </div>
  <div modalRodape>
    <button class="btn-ghost" (click)="cancelar.emit()">
      Salvar sem projetar
    </button>
    <button class="btn-primary" (click)="confirmarProjecoes()">
      <span class="material-symbols-outlined text-base">check</span>
      Confirmar e projetar
    </button>
  </div>
</app-modal>
