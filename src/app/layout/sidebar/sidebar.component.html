<aside class="h-screen sticky top-0 flex flex-col
              bg-white border-r border-slate-200/80
              transition-[width] duration-300 ease-out"
       [class.w-64]="!colapsada()"
       [class.w-20]="colapsada()">

  <!-- Brand -->
  <div class="h-16 flex items-center px-4 border-b border-slate-100">
    <a routerLink="/dashboard" class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600
                  flex items-center justify-center text-white shadow-md shadow-sky-600/20 shrink-0">
        <img src="/logo/albatroz-icon.svg" alt="Albatroz" class="w-5 h-5" />
      </div>
      @if (!colapsada()) {
        <div class="min-w-0">
          <div class="font-semibold text-slate-900 text-sm leading-tight truncate">Albatroz</div>
          <div class="text-[11px] text-slate-400 leading-tight">Tecnologia</div>
        </div>
      }
    </a>
  </div>

  <!-- Menu -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6">
    @for (grupo of grupos; track grupo.titulo) {
      <div>
        @if (!colapsada()) {
          <div class="px-3 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
            {{ grupo.titulo }}
          </div>
        } @else {
          <div class="mx-3 mb-2 h-px bg-slate-100"></div>
        }
        <ul class="space-y-1">
          @for (item of grupo.itens; track item.rota) {
            <li>
              <a [routerLink]="item.rota"
                 routerLinkActive="bg-sky-50 text-sky-700 font-medium ring-1 ring-sky-100"
                 class="group flex items-center gap-3 px-3 py-2.5 rounded-xl
                        text-slate-600 hover:bg-slate-50 hover:text-slate-900
                        transition-colors relative"
                 [class.justify-center]="colapsada()"
                 [title]="colapsada() ? item.label : ''">
                <span class="w-5 h-5 shrink-0 text-current">
                  <ng-container [ngSwitch]="item.icone">
                    <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <svg *ngSwitchCase="'box'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                    <svg *ngSwitchCase="'file-text'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <svg *ngSwitchCase="'layers'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                    <svg *ngSwitchCase="'sparkles'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
                    <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <svg *ngSwitchCase="'shield'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                  </ng-container>
                </span>
                @if (!colapsada()) {
                  <span class="text-sm flex-1 truncate">{{ item.label }}</span>
                  @if (item.badge) {
                    <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md
                                 bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white">
                      {{ item.badge }}
                    </span>
                  }
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <!-- Footer collapse toggle -->
  <button (click)="toggle.emit()"
          class="h-12 border-t border-slate-100 flex items-center justify-center gap-2
                 text-slate-400 hover:text-slate-700 hover:bg-slate-50 text-sm transition-colors">
    <svg class="w-4 h-4 transition-transform" [class.rotate-180]="colapsada()"
         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    @if (!colapsada()) { <span>Recolher</span> }
  </button>
</aside>
