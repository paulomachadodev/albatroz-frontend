@if (aberto()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" style="animation: fade-in 150ms ease-out" (click)="aoClicarNoFundo()"></div>

    <div class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full z-10 max-h-[92vh] flex flex-col overflow-hidden"
         style="animation: modal-in 150ms ease-out"
         [class]="classeTamanho">

      @if (titulo()) {
        <div class="px-6 py-4 flex items-start justify-between gap-4 shrink-0 border-b border-slate-200 dark:border-slate-800">
          <div class="min-w-0">
            <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100">{{ titulo() }}</h2>
            @if (subtitulo()) {
              <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">{{ subtitulo() }}</p>
            }
          </div>
          <button type="button" aria-label="Fechar"
                  class="size-8 shrink-0 flex items-center justify-center rounded-lg text-slate-400
                         hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                  (click)="fechar.emit()">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </div>
      }

      <div class="flex-1 min-h-0 overflow-y-auto px-6 py-5">
        <ng-content></ng-content>
      </div>

      <div class="shrink-0 px-6 py-4 flex flex-wrap items-center justify-end gap-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 empty:hidden">
        <ng-content select="[modalRodape]"></ng-content>
      </div>
    </div>
  </div>
}
