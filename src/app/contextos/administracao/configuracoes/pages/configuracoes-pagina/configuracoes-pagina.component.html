<div class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark px-4 sm:px-6 lg:px-8 xl:px-10 py-6 lg:py-8">
  <div class="w-full space-y-8">
    <app-breadcrumb [itens]="[{label:'Configurações'}]" />
    <app-page-header titulo="Configurações" subtitulo="Encontre os ajustes da sua empresa por assunto." />
    <label class="flex items-center gap-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3">
      <span class="material-symbols-outlined text-slate-400" aria-hidden="true">search</span>
      <input pInputText [value]="busca()" (input)="buscar($event)" placeholder="Buscar configuração: SMTP, preços, CNAB…" aria-label="Buscar configuração" class="w-full min-w-0 text-base bg-transparent border-0 outline-none text-slate-800 dark:text-slate-100" />
    </label>
    <div class="grid lg:grid-cols-[210px_minmax(0,1fr)] gap-6 lg:gap-10">
      <nav aria-label="Categorias de configuração" class="flex flex-wrap gap-2 lg:block lg:space-y-1 lg:self-start">
        <button type="button" (click)="grupoAtivo.set('')" [attr.aria-pressed]="grupoAtivo() === ''" [class.bg-primary/10]="grupoAtivo() === ''" [class.text-primary]="grupoAtivo() === ''" class="text-left px-4 py-3 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 lg:w-full">Visão geral</button>
        @for (grupo of categorias(); track grupo.id) {
          <button type="button" (click)="grupoAtivo.set(grupo.id)" [attr.aria-pressed]="grupoAtivo() === grupo.id" [class.bg-primary/10]="grupoAtivo() === grupo.id" [class.text-primary]="grupoAtivo() === grupo.id" class="text-left px-4 py-3 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 lg:w-full">{{ grupo.titulo }}</button>
        }
      </nav>
      <div class="grid sm:grid-cols-2 gap-x-8 gap-y-8" aria-live="polite">
        @for (grupo of grupos(); track grupo.id) {
          <section class="min-w-0 border-b border-slate-200 dark:border-slate-800 pb-5">
            <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100 mb-3">{{ grupo.titulo }}</h2>
            <div class="space-y-1">
              @for (destino of grupo.destinos; track destino.id) {
                <a [routerLink]="destino.rota" class="group flex items-start justify-between gap-3 rounded-lg px-3 py-3 -mx-3 hover:bg-white dark:hover:bg-slate-900 focus-visible:ring-2 focus-visible:ring-primary/30">
                  <span class="min-w-0"><span class="block text-sm font-medium text-slate-800 dark:text-slate-200 group-hover:text-primary">{{ destino.titulo }}</span><span class="block text-xs text-slate-500 dark:text-slate-400 mt-1">{{ destino.descricao }}</span></span>
                  <span class="text-slate-400 shrink-0" aria-hidden="true">›</span>
                </a>
              }
            </div>
          </section>
        } @empty { <p class="text-sm text-slate-500 sm:col-span-2">Nenhuma configuração disponível para os filtros e permissões atuais.</p> }
      </div>
    </div>
  </div>
</div>
