<div class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark px-4 sm:px-6 lg:px-8 xl:px-10 py-6 lg:py-8">
  <div class="w-full space-y-8">

    <nav class="flex items-center gap-2 text-sm text-slate-500">
      <a class="hover:text-primary" routerLink="/dashboard">Início</a>
      <span class="material-symbols-outlined text-xs">chevron_right</span>
      <span class="text-slate-900 dark:text-slate-100 font-medium">Administração</span>
      <span class="material-symbols-outlined text-xs">chevron_right</span>
      <span class="text-slate-900 dark:text-slate-100 font-medium">Configurações</span>
    </nav>

    <app-page-header titulo="Configurações" subtitulo="Ajustes gerais do sistema, organizados por contexto."></app-page-header>

    <div class="border-b border-slate-200 dark:border-slate-800">
      <nav class="flex gap-6">
        <button (click)="abaAtiva.set('email')"
                class="pb-3 text-sm font-bold border-b-2 transition-colors"
                [class.border-primary]="abaAtiva() === 'email'"
                [class.text-primary]="abaAtiva() === 'email'"
                [class.border-transparent]="abaAtiva() !== 'email'"
                [class.text-slate-500]="abaAtiva() !== 'email'">
          E-mail
        </button>
      </nav>
    </div>

    @if (carregando()) {
      <div class="text-sm text-slate-500">Carregando...</div>
    } @else if (abaAtiva() === 'email') {
      <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
        <p class="text-sm text-slate-500 dark:text-slate-400">
          Servidor usado para enviar e-mails do sistema (recuperação de senha, notificações).
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Servidor SMTP</label>
            <input type="text" [(ngModel)]="smtpHost" placeholder="mail.albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Porta</label>
            <input type="text" [(ngModel)]="smtpPort" placeholder="465"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="smtpSsl" id="smtp-ssl"
                 class="rounded border-slate-300 text-primary focus:ring-primary/20"/>
          <label for="smtp-ssl" class="text-sm text-slate-700 dark:text-slate-300">Usar SSL/TLS</label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Usuário</label>
            <input type="text" [(ngModel)]="smtpUsuario" placeholder="noreply@albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">
              Senha {{ senhaJaConfigurada ? '(já configurada — deixe em branco pra manter)' : '' }}
            </label>
            <input type="password" [(ngModel)]="smtpSenha" [placeholder]="senhaJaConfigurada ? '••••••••' : 'Senha SMTP'"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">E-mail remetente</label>
            <input type="email" [(ngModel)]="smtpRemetente" placeholder="noreply@albatrozpapelaria.com.br"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Nome remetente</label>
            <input type="text" [(ngModel)]="smtpNomeRemetente" placeholder="Albatroz Papelaria"
                   class="mt-1 w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 outline-none"/>
          </div>
        </div>

        <div class="pt-2">
          <button type="button" (click)="salvarEmail()" [disabled]="salvando()"
                  class="px-5 py-2.5 rounded-lg bg-primary text-white font-bold text-sm hover:bg-primary/90 disabled:opacity-50 transition-all">
            {{ salvando() ? 'Salvando...' : 'Salvar' }}
          </button>
        </div>
      </div>
    }

  </div>
</div>
